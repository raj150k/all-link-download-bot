services:
  # ── Option A: Background Worker (polling — simpler) ─────────────────
  - type: worker
    name: all-link-download-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false   # Set manually in Render dashboard
      - key: OWNER_USERNAME
        value: raj169k
      - key: MODE
        value: polling
      - key: DOWNLOAD_DIR
        value: downloads
      - key: CONVERTED_DIR
        value: converted

